<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu menu</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%231A1A1A%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2236%22%20fill%3D%22none%22%20stroke%3D%22%23ECECEA%22%20stroke-width%3D%224.5%22/%3E%3Cpath%20d%3D%22M27%2047%20A23%2023%200%200%201%2073%2047%20Z%22%20fill%3D%22%23ECECEA%22/%3E%3Cpath%20d%3D%22M27%2053%20L47%2053%20L47%2073%20A23%2023%200%200%201%2027%2053%20Z%22%20fill%3D%22%235E5E5B%22/%3E%3Cpath%20d%3D%22M53%2053%20L73%2053%20A23%2023%200%200%201%2053%2073%20Z%22%20fill%3D%22%235E5E5B%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-title" content="Meu menu">
<meta name="theme-color" content="#F4F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#F4F4F2;
  --papel:#FCFCFB;
  --tinta:#1A1A1A;
  --suave:#70706D;
  --folha:#2B2B2A;       /* destaque: grafite */
  --folha-tinta:#FFFFFF;
  --folha-clara:#E8E8E5;
  --linha:#DDDDDA;
  --perigo:#8C3B30;
  --texto:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --fundo:#151515; --papel:#1D1D1D; --tinta:#ECECEA; --suave:#989895;
    --folha:#E2E2DF; --folha-tinta:#151515; --folha-clara:#2A2A2A; --linha:#303030; --perigo:#D9968B;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--fundo);color:var(--tinta);
  font:400 .9375rem/1.5 var(--texto);
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
.pagina{max-width:40rem;margin:0 auto;padding:1.5rem 1.125rem 6rem}
h1{font:600 1.375rem/1.2 var(--texto);letter-spacing:-.01em;margin:0 0 1rem}
.marca{display:flex;align-items:center;gap:.625rem}
.marca svg{width:2rem;height:2rem;flex:none}
h2{font:600 .9375rem/1.3 var(--texto);margin:0}
button,input,textarea{font:inherit;color:inherit}
input,textarea{font-size:1rem} /* evita zoom automático no iPhone */
button{cursor:pointer}
:focus-visible{outline:2px solid var(--folha);outline-offset:2px}

/* navegação */
.nav{display:flex;gap:1.5rem;border-bottom:1px solid var(--linha);margin-bottom:1.75rem}
.nav button{border:0;background:none;padding:.5rem 0 .625rem;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--suave);font-weight:500}
.nav button[aria-current="page"]{color:var(--tinta);border-bottom-color:var(--folha);font-weight:600}

.tela[hidden]{display:none}
.grupo{margin-bottom:2rem}
.grupo-topo{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:.625rem}
.conta{color:var(--suave);font-size:.8125rem;white-space:nowrap}
.vazio{color:var(--suave);margin:0}
.link{border:0;background:none;padding:0;color:var(--folha);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* escolher */
.opcoes{display:flex;flex-wrap:wrap;gap:.375rem}
.opcao{
  border:1px solid var(--linha);background:var(--papel);
  padding:.375rem .75rem;border-radius:999px;text-align:left;
  font-size:.875rem;min-height:2.125rem;
}
.opcao[aria-pressed="true"]{background:var(--folha);border-color:var(--folha);color:var(--folha-tinta);font-weight:500}
.opcao.mini{font-size:.8125rem;min-height:1.875rem;padding:.25rem .625rem}
.sub{margin-top:.75rem;padding:.125rem 0 .125rem .875rem;border-left:2px solid var(--folha)}
.sub h3{font:600 .8125rem/1.3 var(--texto);color:var(--suave);margin:0 0 .375rem}

.barra{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  background:var(--papel);border-top:1px solid var(--linha);
  padding:.625rem 1.125rem calc(.625rem + env(safe-area-inset-bottom,0));
}
.barra[hidden]{display:none}
.barra-dentro{max-width:40rem;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;color:var(--suave);font-size:.875rem}
.barra button{border:0;background:var(--folha);color:var(--folha-tinta);font-weight:600;font-size:.875rem;padding:.5rem 1rem;border-radius:.5rem}
.barra .botoes{display:flex;gap:.5rem;flex:none}
.barra button.sec{background:none;color:var(--tinta);border:1px solid var(--linha)}
.barra button.sec[hidden]{display:none}
.obs-topo{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.375rem}
.obs-topo label{margin:0}
.obs-topo .link{font-size:.8125rem}
.obs-topo .link[hidden]{display:none}

/* resumo */
.comanda{background:var(--papel);border:1px solid var(--linha);border-radius:.75rem;padding:1.125rem 1.25rem}
.comanda h2{font-size:1.0625rem;margin-bottom:.25rem}
.comanda section{padding:.75rem 0;border-bottom:1px solid var(--linha)}
.comanda section:last-of-type{border-bottom:0;padding-bottom:0}
.comanda h3{font:600 .8125rem/1.3 var(--texto);color:var(--suave);margin:0 0 .25rem}
.comanda ul{list-style:none;margin:0;padding:0}
.comanda li{padding:.0625rem 0}
.comanda .nada{color:var(--suave)}
.obs{margin-top:1.25rem}
.obs label{display:block;font-weight:600;font-size:.8125rem;color:var(--suave);margin-bottom:.375rem}
.obs textarea{width:100%;min-height:4rem;resize:vertical;background:var(--papel);border:1px solid var(--linha);border-radius:.5rem;padding:.5rem .75rem}
.acoes{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.botao{border:1px solid var(--linha);background:var(--papel);padding:.5rem 1rem;border-radius:.5rem;font-weight:600;font-size:.875rem}
.botao.cheio{background:var(--folha);border-color:var(--folha);color:var(--folha-tinta)}
.aviso{min-height:1.375rem;margin:.625rem 0 0;color:var(--folha);font-size:.875rem}

/* opções */
.lista{list-style:none;margin:0 0 .625rem;padding:0;border-top:1px solid var(--linha)}
.lista:empty{display:none}
.lista > li{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.25rem 0;border-bottom:1px solid var(--linha)}
.lista > li.sub-ed{display:block;padding:.5rem 0 .75rem .875rem;border-left:2px solid var(--folha)}
.qtd-sub{color:var(--suave);font-size:.8125rem;margin-left:.375rem}
.sub-lista{list-style:none;margin:0 0 .5rem;padding:0}
.sub-lista li{display:flex;align-items:center;justify-content:space-between;gap:.75rem;font-size:.875rem}
.sub-ed .dica{margin:0 0 .375rem}
.acoes-item{display:flex;flex:none;gap:.25rem}
.acao,.remover{border:0;background:none;font-size:.8125rem;font-weight:500;padding:.375rem .5rem;border-radius:.375rem}
.acao{color:var(--folha)}
.acao.neutra{color:var(--suave)}
.remover{color:var(--perigo)}
.campo-ed{flex:1;min-width:0;background:var(--papel);border:1px solid var(--folha);border-radius:.375rem;padding:.3125rem .5rem}
.novo{display:flex;gap:.5rem}
.novo input{flex:1;min-width:0;background:var(--papel);border:1px solid var(--linha);border-radius:.5rem;padding:.4375rem .75rem}
.novo button{flex:none}
.exportar{border-top:1px solid var(--linha);padding-top:1.25rem;margin-top:.5rem}
.dica{color:var(--suave);font-size:.8125rem;margin:0 0 .75rem}
</style>
</head>
<body>
<div class="pagina">
  <h1 class="marca" aria-label="Meu menu"><svg viewBox="12 12 76 76" aria-hidden="true" focusable="false"><circle cx="50" cy="50" r="36" fill="none" stroke="currentColor" stroke-width="4.5"/><path d="M27 47 A23 23 0 0 1 73 47 Z" fill="currentColor"/><path d="M27 53 L47 53 L47 73 A23 23 0 0 1 27 53 Z M53 53 L73 53 A23 23 0 0 1 53 73 Z" fill="currentColor" opacity=".35"/></svg></h1>

  <nav class="nav" aria-label="Seções">
    <button type="button" data-tela="escolher" aria-current="page">Escolher</button>
    <button type="button" data-tela="resumo">Resumo</button>
    <button type="button" data-tela="opcoes">Opções</button>
  </nav>

  <main>
    <div class="tela" id="tela-escolher"></div>

    <div class="tela" id="tela-resumo" hidden>
      <div class="comanda" id="comanda"></div>
      <div class="obs">
        <div class="obs-topo">
          <label for="obs">Observações</label>
          <button type="button" class="link" id="limpar-obs" hidden>Limpar</button>
        </div>
        <textarea id="obs" placeholder="Ex.: frango sem pimenta, arroz em porções pequenas"></textarea>
      </div>
      <div class="acoes">
        <button type="button" class="botao cheio" id="copiar">Copiar resumo</button>
        <button type="button" class="botao" id="limpar">Limpar escolhas e observações</button>
      </div>
      <p class="aviso" id="aviso" role="status"></p>
    </div>

    <div class="tela" id="tela-opcoes" hidden></div>
  </main>
</div>

<div class="barra" id="barra">
  <div class="barra-dentro">
    <span id="barra-texto"></span>
    <span class="botoes">
      <button type="button" class="sec" id="limpar-barra" hidden>Limpar</button>
      <button type="button" id="ver-resumo">Ver resumo</button>
    </span>
  </div>
</div>

<script>
(function(){
  var CATS = [
    {id:'proteinas', nome:'Proteína', singular:'proteína'},
    {id:'saladas', nome:'Salada', singular:'salada'},
    {id:'acompanhamentos', nome:'Acompanhamento', singular:'acompanhamento'},
    {id:'frutas', nome:'Fruta', singular:'fruta'},
    {id:'extras', nome:'Extra', singular:'extra'},
    {id:'preparacoes', nome:'Preparação', singular:'preparação'}
  ];

  // Lista inicial. Depois de alterada na aba Opções, vale o que estiver salvo no navegador.
  var PADRAO = {
    proteinas: ['Patinho moído','Carne de panela','Sobrecoxa desossada','Filé de frango','Filé de boi','Parmegiana','Frango em cubos','Estrogonofe de frango','Picadinho de filé de boi','Picadinho de filé de frango','Rosbife','Tilápia','Salmão','Moela','Medalhão de frango','Medalhão de boi','Patinho moído com cenoura e batata'],
    saladas: ['Alface','Rúcula','Agrião','Espinafre','Couve fininha (crua)','Repolho fatiado','Tomate','Pepino','Cenoura ralada','Beterraba (cozida ou crua)','Cebola roxa fatiada','Rabanete fatiado','Palmito','Milho','Grão-de-bico cozido','Manga em cubos'],
    acompanhamentos: ['Arroz branco','Arroz integral','Arroz à grega','Feijão carioca','Feijão preto','Lentilha','Mandioca cozida','Purê de mandioca','Batata-doce assada','Purê de batata-doce','Batata inglesa assada','Batata cozida','Batata sauté','Purê de batata inglesa','Purê de batata-baroa','Quinoa','Nhoque','Farofa temperada','Purê de abóbora','Brócolis no vapor','Brócolis salteado','Arroz de brócolis','Couve refogada','Vagem refogada','Vagem com ovos','Vagem com cenoura','Aspargos grelhados','Couve-flor assada','Couve-flor salteada','Repolho refogado','Abóbora assada','Cenoura assada','Berinjela com tomate','Abobrinha grelhada','Pimentão salteado','Chuchu refogado','Jiló refogado','Rabanete salteado','Cogumelos salteados','Quiabo refogado','Milho na manteiga','Legumes grelhados','Legumes assados'],
    extras: ['Marinada de frango','Bife de boi temperado','Tabuleiro de peixe com legumes','Carne para ensopado temperada','Legumes fatiados para salteado','Kafta moldada crua','Tabuleiro de frango com batatas','Marinada de peixe','Feijoada completa','Tropeiro','Moqueca de peixe','Vaca atolada','Baião de dois','Galinhada','Fricassê de frango','Escondidinho de carne','Escondidinho de frango','Escondidinho de mandioca com carne seca'],
    preparacoes: ['Marinada de frango','Bifes temperados para passar','Lasanha montada'],
    frutas: ['Abacaxi picado','Manga picada','Mamão picado','Melão picado','Melancia picada','Morango lavado','Uva lavada','Kiwi picado','Laranja descascada','Salada de frutas']
  };

  // Itens de sub-seleção: ao marcar a opção, aparecem estes itens para escolher.
  var PADRAO_SUBS = {
    acompanhamentos: {
      'Legumes grelhados': ['Abobrinha','Berinjela','Pimentão','Cebola','Cenoura','Aspargos','Cogumelos','Tomate','Chuchu','Brócolis'],
      'Legumes assados': ['Abóbora','Cenoura','Batata','Batata-doce','Beterraba','Cebola','Couve-flor','Brócolis','Pimentão','Abobrinha','Berinjela']
    },
    frutas: {
      'Salada de frutas': ['Abacaxi','Manga','Mamão','Melão','Banana','Maçã','Morango','Uva','Kiwi','Laranja']
    }
  };

  var CHAVE = 'meu-menu-v3';
  var CHAVE_ANTIGA = 'cozinha_estado_v4';
  var estado = carregar();

  function carregar(){
    var base = {opcoes: JSON.parse(JSON.stringify(PADRAO)), escolhas:{}, obs:''};
    try{
      var salvo = JSON.parse(localStorage.getItem(CHAVE));
      if(salvo && salvo.opcoes){ base = salvo; }
      else {
        // Primeira abertura: aproveita o que foi adicionado ou removido no app antigo neste aparelho.
        var antigo = JSON.parse(localStorage.getItem(CHAVE_ANTIGA));
        if(antigo){
          CATS.forEach(function(c){
            var rem = (antigo.removidos && antigo.removidos[c.id]) || [];
            base.opcoes[c.id] = base.opcoes[c.id].filter(function(n){ return rem.indexOf(n) < 0; });
            ((antigo.itensCustom && antigo.itensCustom[c.id]) || []).forEach(function(i){
              if(i && i.nome && base.opcoes[c.id].indexOf(i.nome) < 0) base.opcoes[c.id].push(i.nome);
            });
          });
        }
      }
    }catch(e){}
    var subsNovos = !base.subs || typeof base.subs !== 'object';
    if(subsNovos) base.subs = {};
    if(!base.subEscolhas || typeof base.subEscolhas !== 'object') base.subEscolhas = {};
    CATS.forEach(function(c){
      if(!Array.isArray(base.opcoes[c.id])) base.opcoes[c.id] = (PADRAO[c.id] || []).slice();
      if(!Array.isArray(base.escolhas[c.id])) base.escolhas[c.id] = [];
      if(!base.subs[c.id] || typeof base.subs[c.id] !== 'object') base.subs[c.id] = {};
      if(!base.subEscolhas[c.id] || typeof base.subEscolhas[c.id] !== 'object') base.subEscolhas[c.id] = {};
      // Primeira vez com sub-seleção: traz os itens padrão das opções que existem.
      if(subsNovos){
        var p = PADRAO_SUBS[c.id] || {};
        Object.keys(p).forEach(function(nome){
          if(base.opcoes[c.id].indexOf(nome) > -1) base.subs[c.id][nome] = p[nome].slice();
        });
      }
    });
    if(typeof base.obs !== 'string') base.obs = '';
    ordenar(base);
    return base;
  }
  function compara(x, y){ return x.localeCompare(y, 'pt-BR', {sensitivity:'base'}); }
  function ordenar(e){
    CATS.forEach(function(c){
      e.opcoes[c.id].sort(compara);
      Object.keys(e.subs[c.id]).forEach(function(k){ e.subs[c.id][k].sort(compara); });
    });
  }
  function subsDe(cat, nome){ return estado.subs[cat][nome] || []; }
  function subEsc(cat, nome){
    var m = estado.subEscolhas[cat];
    if(!Array.isArray(m[nome])) m[nome] = [];
    return m[nome];
  }
  function subsEscolhidos(cat, nome){
    var esc = subEsc(cat, nome);
    return subsDe(cat, nome).filter(function(s){ return esc.indexOf(s) > -1; });
  }
  function rotulo(cat, nome){
    var s = subsEscolhidos(cat, nome);
    return s.length ? nome + ' (' + s.join(', ') + ')' : nome;
  }
  function salvar(){
    ordenar(estado);
    try{ localStorage.setItem(CHAVE, JSON.stringify(estado)); }catch(e){}
  }
  function el(tag, attrs, texto){
    var n = document.createElement(tag);
    if(attrs) Object.keys(attrs).forEach(function(k){ n.setAttribute(k, attrs[k]); });
    if(texto != null) n.textContent = texto;
    return n;
  }
  function total(){
    return CATS.reduce(function(s,c){ return s + estado.escolhas[c.id].length; }, 0);
  }

  /* ---------- Escolher ---------- */
  var telaEscolher = document.getElementById('tela-escolher');
  function desenharEscolher(){
    telaEscolher.textContent = '';
    CATS.forEach(function(c){
      var grupo = el('section', {'class':'grupo'});
      var topo = el('div', {'class':'grupo-topo'});
      topo.appendChild(el('h2', null, c.nome));
      var n = estado.escolhas[c.id].length;
      topo.appendChild(el('span', {'class':'conta'}, n ? n + (n === 1 ? ' escolhida' : ' escolhidas') : ''));
      if(c.id === 'acompanhamentos' || c.id === 'extras'){
        topo.lastChild.textContent = n ? n + (n === 1 ? ' escolhido' : ' escolhidos') : '';
      }
      grupo.appendChild(topo);

      if(!estado.opcoes[c.id].length){
        var p = el('p', {'class':'vazio'}, 'Nenhuma opção ainda. ');
        var b = el('button', {'type':'button','class':'link'}, 'Adicionar em Opções');
        b.addEventListener('click', function(){ mostrar('opcoes'); });
        p.appendChild(b);
        grupo.appendChild(p);
      } else {
        var caixa = el('div', {'class':'opcoes'});
        estado.opcoes[c.id].forEach(function(nome){
          var marcado = estado.escolhas[c.id].indexOf(nome) > -1;
          var nSub = marcado ? subsEscolhidos(c.id, nome).length : 0;
          var bt = el('button', {'type':'button','class':'opcao','aria-pressed': String(marcado)}, nome + (nSub ? ' · ' + nSub : ''));
          bt.addEventListener('click', function(){
            var i = estado.escolhas[c.id].indexOf(nome);
            if(i > -1) estado.escolhas[c.id].splice(i,1); else estado.escolhas[c.id].push(nome);
            salvar(); desenharEscolher(); desenharBarra();
          });
          caixa.appendChild(bt);
        });
        grupo.appendChild(caixa);

        // Sub-seleção das opções marcadas que têm itens
        escolhidasEmOrdem(c).forEach(function(nome){
          var itens = subsDe(c.id, nome);
          if(!itens.length) return;
          var sub = el('div', {'class':'sub'});
          sub.appendChild(el('h3', null, nome + ': quais?'));
          var cx = el('div', {'class':'opcoes'});
          itens.forEach(function(item){
            var esc = subEsc(c.id, nome);
            var bt = el('button', {'type':'button','class':'opcao mini','aria-pressed': String(esc.indexOf(item) > -1)}, item);
            bt.addEventListener('click', function(){
              var lista = subEsc(c.id, nome);
              var i = lista.indexOf(item);
              if(i > -1) lista.splice(i,1); else lista.push(item);
              salvar(); desenharEscolher();
            });
            cx.appendChild(bt);
          });
          sub.appendChild(cx);
          grupo.appendChild(sub);
        });
      }
      telaEscolher.appendChild(grupo);
    });
  }

  /* ---------- Resumo ---------- */
  var comanda = document.getElementById('comanda');
  var obs = document.getElementById('obs');
  var aviso = document.getElementById('aviso');
  function escolhidasEmOrdem(c){
    return estado.opcoes[c.id].filter(function(n){ return estado.escolhas[c.id].indexOf(n) > -1; });
  }
  function desenharResumo(){
    comanda.textContent = '';
    comanda.appendChild(el('h2', null, 'Cardápio'));
    CATS.forEach(function(c){
      var s = el('section');
      s.appendChild(el('h3', null, c.nome));
      var itens = escolhidasEmOrdem(c);
      if(!itens.length){
        s.appendChild(el('p', {'class':'nada','style':'margin:0'}, 'Nada escolhido'));
      } else {
        var ul = el('ul');
        itens.forEach(function(n){ ul.appendChild(el('li', null, rotulo(c.id, n))); });
        s.appendChild(ul);
      }
      comanda.appendChild(s);
    });
    obs.value = estado.obs;
    mostrarLimparObs();
    aviso.textContent = '';
  }
  function textoResumo(){
    var linhas = ['Cardápio'];
    CATS.forEach(function(c){
      var itens = escolhidasEmOrdem(c);
      if(itens.length){
        linhas.push('');
        linhas.push(c.nome + ':');
        itens.forEach(function(n){ linhas.push('- ' + rotulo(c.id, n)); });
      }
    });
    if(estado.obs.trim()){
      linhas.push(''); linhas.push('Observações: ' + estado.obs.trim());
    }
    return linhas.join('\n');
  }
  var limparObs = document.getElementById('limpar-obs');
  function mostrarLimparObs(){ limparObs.hidden = !estado.obs; }
  obs.addEventListener('input', function(){ estado.obs = obs.value; salvar(); mostrarLimparObs(); });
  limparObs.addEventListener('click', function(){
    guarda = {escolhas: estado.escolhas, subEscolhas: estado.subEscolhas, obs: estado.obs, soObs: true};
    guarda = JSON.parse(JSON.stringify(guarda));
    estado.obs = ''; salvar();
    obs.value = ''; mostrarLimparObs();
    avisoDesfazer('Observações limpas.');
  });

  // Limpar com opção de desfazer
  var guarda = null;
  function limparTudo(){
    guarda = JSON.parse(JSON.stringify({escolhas: estado.escolhas, subEscolhas: estado.subEscolhas, obs: estado.obs}));
    CATS.forEach(function(c){ estado.escolhas[c.id] = []; estado.subEscolhas[c.id] = {}; });
    estado.obs = '';
    salvar();
  }
  function desfazer(){
    if(!guarda) return;
    if(guarda.soObs){ estado.obs = guarda.obs; }
    else { estado.escolhas = guarda.escolhas; estado.subEscolhas = guarda.subEscolhas; estado.obs = guarda.obs; }
    guarda = null;
    salvar();
  }
  function avisoDesfazer(msg){
    aviso.textContent = msg + ' ';
    var b = el('button', {'type':'button','class':'link'}, 'Desfazer');
    b.addEventListener('click', function(){ desfazer(); desenharResumo(); desenharBarra(); aviso.textContent = 'Restaurado.'; });
    aviso.appendChild(b);
  }

  document.getElementById('copiar').addEventListener('click', function(){
    if(!total()){ aviso.textContent = 'Escolha pelo menos uma opção antes de copiar.'; return; }
    var texto = textoResumo();
    function ok(){ aviso.textContent = 'Resumo copiado.'; }
    function reserva(){
      var t = el('textarea'); t.value = texto; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      try{ document.execCommand('copy'); ok(); }
      catch(e){ aviso.textContent = 'Não foi possível copiar. Selecione o texto da comanda e copie manualmente.'; }
      document.body.removeChild(t);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(texto).then(ok, reserva);
    } else { reserva(); }
  });

  document.getElementById('limpar').addEventListener('click', function(){
    if(!total() && !estado.obs){ aviso.textContent = 'Nada para limpar.'; return; }
    limparTudo();
    desenharResumo(); desenharBarra();
    avisoDesfazer('Escolhas e observações limpas.');
  });

  /* ---------- Opções ---------- */
  var telaOpcoes = document.getElementById('tela-opcoes');
  var editando = null;
  var abertoSub = null;

  // Painel para editar os itens de sub-seleção de uma opção
  function painelSub(c, nome){
    var li = el('li', {'class':'sub-ed'});
    var itens = subsDe(c.id, nome);
    li.appendChild(el('p', {'class':'dica'}, itens.length
      ? 'Ao marcar "' + nome + '", você escolhe entre estes itens:'
      : 'Adicione itens para escolher quais entram em "' + nome + '".'));
    if(itens.length){
      var ul = el('ul', {'class':'sub-lista'});
      itens.forEach(function(item){
        var l = el('li');
        l.appendChild(el('span', null, item));
        var r = el('button', {'type':'button','class':'remover','aria-label':'Remover ' + item}, 'Remover');
        r.addEventListener('click', function(){
          estado.subs[c.id][nome] = subsDe(c.id, nome).filter(function(x){ return x !== item; });
          if(!estado.subs[c.id][nome].length) delete estado.subs[c.id][nome];
          var esc = subEsc(c.id, nome), i = esc.indexOf(item);
          if(i > -1) esc.splice(i,1);
          salvar(); desenharOpcoes(null, true);
        });
        l.appendChild(r);
        ul.appendChild(l);
      });
      li.appendChild(ul);
    }
    var linha = el('div', {'class':'novo'});
    var campo = el('input', {'type':'text','id':'novo-sub','placeholder':'Novo item','aria-label':'Novo item em ' + nome,'maxlength':'60','autocomplete':'off'});
    var add = el('button', {'type':'button','class':'botao cheio'}, 'Adicionar');
    function adicionar(){
      var item = campo.value.trim().replace(/\s+/g,' ');
      if(!item){ campo.focus(); return; }
      var lista = subsDe(c.id, nome);
      if(lista.some(function(x){ return x.toLowerCase() === item.toLowerCase(); })){
        campo.value = ''; campo.setAttribute('placeholder','Esse item já existe'); campo.focus(); return;
      }
      estado.subs[c.id][nome] = lista.concat([item]);
      salvar(); desenharOpcoes(null, true);
    }
    add.addEventListener('click', adicionar);
    campo.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); adicionar(); } });
    linha.appendChild(campo); linha.appendChild(add);
    li.appendChild(linha);
    return li;
  }

  function desenharOpcoes(focarEm, focarSub){
    telaOpcoes.textContent = '';
    var campoFoco = null;
    CATS.forEach(function(c){
      var grupo = el('section', {'class':'grupo'});
      var topo = el('div', {'class':'grupo-topo'});
      topo.appendChild(el('h2', null, c.nome));
      grupo.appendChild(topo);

      var ul = el('ul', {'class':'lista'});
      estado.opcoes[c.id].forEach(function(nome){
        var li = el('li');
        if(editando && editando.cat === c.id && editando.nome === nome){
          var campoEd = el('input', {'type':'text','class':'campo-ed','aria-label':'Novo nome para ' + nome,'maxlength':'60','autocomplete':'off'});
          campoEd.value = nome;
          var salvarBt = el('button', {'type':'button','class':'acao'}, 'Salvar');
          var cancelarBt = el('button', {'type':'button','class':'acao neutra'}, 'Cancelar');
          function salvarEdicao(){
            var novo = campoEd.value.trim().replace(/\s+/g,' ');
            if(!novo){ campoEd.focus(); return; }
            var existe = estado.opcoes[c.id].some(function(n){ return n !== nome && n.toLowerCase() === novo.toLowerCase(); });
            if(existe){ campoEd.value = ''; campoEd.setAttribute('placeholder','Essa opção já existe'); campoEd.focus(); return; }
            estado.opcoes[c.id] = estado.opcoes[c.id].map(function(n){ return n === nome ? novo : n; });
            estado.escolhas[c.id] = estado.escolhas[c.id].map(function(n){ return n === nome ? novo : n; });
            [estado.subs[c.id], estado.subEscolhas[c.id]].forEach(function(m){
              if(novo !== nome && m[nome]){ m[novo] = m[nome]; delete m[nome]; }
            });
            if(abertoSub && abertoSub.cat === c.id && abertoSub.nome === nome) abertoSub.nome = novo;
            editando = null;
            salvar(); desenharOpcoes();
          }
          salvarBt.addEventListener('click', salvarEdicao);
          cancelarBt.addEventListener('click', function(){ editando = null; desenharOpcoes(); });
          campoEd.addEventListener('keydown', function(e){
            if(e.key === 'Enter'){ e.preventDefault(); salvarEdicao(); }
            if(e.key === 'Escape'){ editando = null; desenharOpcoes(); }
          });
          li.appendChild(campoEd);
          var acoesEd = el('span', {'class':'acoes-item'});
          acoesEd.appendChild(salvarBt); acoesEd.appendChild(cancelarBt);
          li.appendChild(acoesEd);
          ul.appendChild(li);
          campoFoco = campoEd;
          return;
        }
        var aberto = abertoSub && abertoSub.cat === c.id && abertoSub.nome === nome;
        var nomeEl = el('span', null, nome);
        var qtd = subsDe(c.id, nome).length;
        if(qtd) nomeEl.appendChild(el('span', {'class':'qtd-sub'}, qtd + (qtd === 1 ? ' item' : ' itens')));
        li.appendChild(nomeEl);
        var acoesItem = el('span', {'class':'acoes-item'});
        var it = el('button', {'type':'button','class':'acao neutra','aria-expanded': String(!!aberto),'aria-label':'Itens de ' + nome}, aberto ? 'Fechar' : 'Itens');
        it.addEventListener('click', function(){
          abertoSub = aberto ? null : {cat:c.id, nome:nome};
          editando = null;
          desenharOpcoes(null, !aberto);
        });
        var ed = el('button', {'type':'button','class':'acao','aria-label':'Editar ' + nome}, 'Editar');
        ed.addEventListener('click', function(){ editando = {cat:c.id, nome:nome}; desenharOpcoes(); });
        var r = el('button', {'type':'button','class':'remover','aria-label':'Remover ' + nome}, 'Remover');
        r.addEventListener('click', function(){
          estado.opcoes[c.id] = estado.opcoes[c.id].filter(function(n){ return n !== nome; });
          estado.escolhas[c.id] = estado.escolhas[c.id].filter(function(n){ return n !== nome; });
          delete estado.subs[c.id][nome];
          delete estado.subEscolhas[c.id][nome];
          if(aberto) abertoSub = null;
          editando = null;
          salvar(); desenharOpcoes(); desenharBarra();
        });
        acoesItem.appendChild(it); acoesItem.appendChild(ed); acoesItem.appendChild(r);
        li.appendChild(acoesItem);
        ul.appendChild(li);
        if(aberto) ul.appendChild(painelSub(c, nome));
      });
      grupo.appendChild(ul);

      var linha = el('div', {'class':'novo'});
      var campo = el('input', {'type':'text','id':'novo-' + c.id,'placeholder':'Nova ' + c.singular,'aria-label':'Nova opção em ' + c.nome,'maxlength':'60','autocomplete':'off'});
      if(c.id === 'acompanhamentos' || c.id === 'extras') campo.setAttribute('placeholder','Novo ' + c.singular);
      var add = el('button', {'type':'button','class':'botao cheio'}, 'Adicionar');
      function adicionar(){
        var nome = campo.value.trim().replace(/\s+/g,' ');
        if(!nome) { campo.focus(); return; }
        var existe = estado.opcoes[c.id].some(function(n){ return n.toLowerCase() === nome.toLowerCase(); });
        if(existe){ campo.select(); campo.setAttribute('placeholder','Essa opção já existe'); campo.value = ''; return; }
        estado.opcoes[c.id].push(nome);
        salvar(); desenharOpcoes(c.id);
      }
      add.addEventListener('click', adicionar);
      campo.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); adicionar(); } });
      linha.appendChild(campo); linha.appendChild(add);
      grupo.appendChild(linha);
      telaOpcoes.appendChild(grupo);
    });

    var exportar = el('section', {'class':'exportar'});
    exportar.appendChild(el('p', {'class':'dica'}, 'Copie as listas e cole no chat com o Claude para que elas passem a valer em todos os aparelhos.'));
    var copiarOp = el('button', {'type':'button','class':'botao'}, 'Copiar opções');
    var avisoOp = el('p', {'class':'aviso','role':'status'});
    copiarOp.addEventListener('click', function(){
      copiarTexto(textoOpcoes(),
        function(){ avisoOp.textContent = 'Opções copiadas. Agora é só colar no chat.'; },
        function(){ avisoOp.textContent = 'Não foi possível copiar. Tente de novo.'; });
    });
    exportar.appendChild(copiarOp);
    exportar.appendChild(avisoOp);
    telaOpcoes.appendChild(exportar);

    if(focarEm){ var f = document.getElementById('novo-' + focarEm); if(f) f.focus(); }
    if(focarSub){ var fs = document.getElementById('novo-sub'); if(fs) fs.focus(); }
    if(campoFoco){ campoFoco.focus(); campoFoco.select(); }
  }

  function textoOpcoes(){
    var linhas = ['OPÇÕES DO MEU MENU'];
    CATS.forEach(function(c){
      linhas.push('');
      linhas.push(c.nome + ' (' + estado.opcoes[c.id].length + '):');
      estado.opcoes[c.id].forEach(function(n){
        var s = subsDe(c.id, n);
        linhas.push('- ' + n + (s.length ? ': ' + s.join(', ') : ''));
      });
    });
    return linhas.join('\n');
  }
  function copiarTexto(texto, ok, falha){
    function reserva(){
      var t = el('textarea'); t.value = texto; t.setAttribute('readonly','');
      t.style.position = 'fixed'; t.style.top = '-9999px';
      document.body.appendChild(t); t.select(); t.setSelectionRange(0, texto.length);
      var deu = false;
      try{ deu = document.execCommand('copy'); }catch(e){}
      document.body.removeChild(t);
      if(deu) ok(); else falha();
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(texto).then(ok, reserva);
    } else { reserva(); }
  }

  /* ---------- Navegação ---------- */
  var barra = document.getElementById('barra');
  var barraTexto = document.getElementById('barra-texto');
  var telaAtual = 'escolher';
  function desenharBarra(){
    var n = total();
    barra.hidden = telaAtual !== 'escolher';
    var podeDesfazer = guarda && !guarda.soObs && n === 0;
    barraTexto.textContent = podeDesfazer ? 'Escolhas limpas' : (n === 0 ? 'Nada escolhido ainda' : (n === 1 ? '1 item escolhido' : n + ' itens escolhidos'));
    limparBarra.hidden = !(n > 0 || estado.obs || podeDesfazer);
    limparBarra.textContent = podeDesfazer ? 'Desfazer' : 'Limpar';
  }
  var limparBarra = document.getElementById('limpar-barra');
  limparBarra.addEventListener('click', function(){
    if(guarda && !guarda.soObs && total() === 0) desfazer(); else limparTudo();
    desenharEscolher(); desenharBarra();
  });
  function mostrar(nome){
    telaAtual = nome;
    ['escolher','resumo','opcoes'].forEach(function(t){
      document.getElementById('tela-' + t).hidden = t !== nome;
    });
    document.querySelectorAll('.nav button').forEach(function(b){
      if(b.getAttribute('data-tela') === nome) b.setAttribute('aria-current','page');
      else b.removeAttribute('aria-current');
    });
    if(nome === 'escolher') desenharEscolher();
    if(nome === 'resumo') desenharResumo();
    if(nome === 'opcoes'){ editando = null; abertoSub = null; desenharOpcoes(); }
    desenharBarra();
    window.scrollTo(0,0);
  }
  document.querySelectorAll('.nav button').forEach(function(b){
    b.addEventListener('click', function(){ mostrar(b.getAttribute('data-tela')); });
  });
  document.getElementById('ver-resumo').addEventListener('click', function(){ mostrar('resumo'); });

  mostrar('escolher');
})();
</script>
</body>
</html>
